project:
  name: "Logi_Freight"
  version: "1.0.0"
  description: "Production Logistics Forecasting (LF) Machine Learning System"

paths:
  models_dir: "models"
  data_raw_dir: "data/raw"
  data_processed_dir: "data/processed"
  reports_dir: "reports"
  examples_dir: "examples"

thresholds:
  classification_threshold: 0.42
  risk_tiers:
    low: 20.0
    medium: 50.0
    high: 80.0
  telemetry_stoppage_minutes_alert: 180.0
  elapsed_frac_late_alert: 1.15
  traffic_congestion_ratio_alert: 0.65
  heavy_rainfall_mm_alert: 10.0

api_config:
  open_meteo:
    base_url: "https://api.open-meteo.com/v1/forecast"
    timeout_seconds: 3.0
  tomtom:
    base_url: "https://api.tomtom.com/traffic/services/4/flowSegmentData"
    api_key_env_var: "TOMTOM_API_KEY"
    timeout_seconds: 3.0
  gdelt:
    base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
    timeout_seconds: 3.0
